operationId: get-racecourse
summary: Get Racecourse
description: |
  Get a racecourse specified by the identifier.
parameters:
- $ref: ../../../components/parameters/id.yaml
- $ref: ../../../components/parameters/include-racecourse.yaml
responses:
  '200':
    description: Successful response
    content:
      application/vnd.api+json:
        schema:
          type: object
          required: [data]
          additionalProperties: false
          properties:
            data:
              $ref: ../../../components/schemas/Racecourse.yaml
            included:
              description: |
                Resources referenced by `data.relationships.country`.
                Present if and only if the `include` query parameter contains `country`.
              type: array
              items:
                $ref: ../../../components/schemas/Country.yaml
              minItems: 1
              maxItems: 1
  '400':
    $ref: ../../../components/responses/400.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '406':
    $ref: ../../../components/responses/406.yaml
