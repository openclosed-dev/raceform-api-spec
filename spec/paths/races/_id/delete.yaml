operationId: delete-race
summary: Delete Race
description: |
  Delete a race specified by the identifier.
  The run resources related to the race are deleted atomically along with it.
  Afterward, requests for those runs return `404`.
  Deleting an already deleted resource returns `404`.
parameters:
- $ref: ../../../components/parameters/id.yaml
responses:
  '204':
    $ref: ../../../components/responses/204.yaml
  '400':
    $ref: ../../../components/responses/400.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '406':
    $ref: ../../../components/responses/406.yaml
