name: include
in: query
description: |
  A comma-separated list of relationship paths of related resources to include in the response document.
  If omitted or empty, no related resources are included.
  Duplicate values are allowed.
  Any value other than `country` results in a `400` error response.
required: false
style: form
explode: false
schema:
  type: array
  items:
    type: string
    enum: [country]
