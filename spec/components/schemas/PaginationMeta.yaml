description: |
  A meta object containing the statistics about the collection of the primary resources.
type: object
required: [total, totalPages]
properties:
  total:
    description: |
      The total number of resources matching the filter conditions (if any),
      regardless of pagination.
    type: integer
    format: int64
    minimum: 0
  totalPages:
    description: |
      The total number of pages in the collection, calculated as follows:
      ```
      ceil(total/L)
      ```
      where `L` is the effective value of `page[limit]` after capping at the upper limit described in the `page[limit]` section.
      `page[offset]` is not used in the calculation.
      The value is `0` when `total` is `0`.
    type: integer
    format: int64
    minimum: 0
