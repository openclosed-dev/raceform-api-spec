description: |
  An error object defined in the JSON:API Specification.
type: object
required: [status, title, detail]
properties:
  status:
    description: The HTTP status code, expressed as a string.
    type: string
  title:
    description: |
      A short, human-readable summary of the problem
      that SHOULD NOT change from occurrence to occurrence of the problem.
    type: string
  detail:
    description: |
      A human-readable explanation specific to this occurrence of the problem.
    type: string
  source:
    description: |
      An object containing references to the primary source of the error.
      This property is always omitted when no child property exists.
    type: object
    minProperties: 1
    properties:
      parameter:
        description: |
          A string indicating which URI query parameter caused the error.
          This property exists if and only if `status` is `400`.
          The value is the percent-decoded parameter name (e.g., `page[limit]`).
        type: string
      header:
        description: |
          A string indicating the name of a single request header which caused the error.
          This property exists if and only if `status` is `406`.
          The value is always `Accept`.
        type: string
