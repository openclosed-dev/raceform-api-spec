x-summary: Bad Request
description: |
  This error is returned in the following cases:
  - A query parameter not listed in the parameters section was specified.
    This includes the following query parameters defined in the JSON:API specification:
      - `fields`
      - `sort`
      - `page`
      - `filter`
  - An invalid value was specified for a query parameter listed in the parameters section.
content:
  application/vnd.api+json:
    schema:
      type: object
      required: [errors]
      properties:
        errors:
          description: One or more errors.
          type: array
          minItems: 1
          items:
            $ref: ../schemas/Error.yaml
