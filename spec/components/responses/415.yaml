x-summary: Unsupported Media Type
description: |
  Returned when the `Content-Type` header specifies the JSON:API media type
  modified with any media type parameter other than `profile`.
  Note that this API supports no extensions, so `ext` is treated as unsupported,
  while `profile` values are ignored.
content:
  application/vnd.api+json:
    schema:
      type: object
      required: [errors]
      properties:
        errors:
          description: A single error.
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: ../schemas/Error.yaml
