openapi: 3.1.0
info:
  version: '1.0.0'
  title: Raceform API
  description: |
    Web API for processing Raceform data.

    ## Common Specifications
    - Clients must percent-encode `[` and `]` in query parameter names.
      Any query parameter whose name contains an unencoded `[` or `]`
      results in a `400` error response.
    - All responses use the Content-Type `application/vnd.api+json`
      without any media type parameters.
    - Errors are evaluated in the following order:
      `415`, `406`, `400`, `404`.
      Only the status of the first matching error category is returned.
      A `400` response may contain multiple error objects.
    - When comparing character strings:
      - All characters in the query parameter value, including `%` and `_`, are matched literally.
      - Case-insensitive matching uses Unicode simple case folding.
        Diacritics are significant.

paths:
